name: Axe accessibility testing

on:
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/**"
      - "!lighthouse_results/**"
  workflow_dispatch:
    inputs:
      url:
        description: "URL to be checked (e.g.: blog/)"
        required: false

env:
  URL: ""

jobs:
  check:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.299.0
        with:
          ruby-version: "3.2.2"
          bundler-cache: true
      - name: Update _config.yml
        run: |
          sed -i "s|^  repo:.*|  repo: ${{ github.repository }}|" _config.yml
          sed -i "s|^baseurl:.*|baseurl: |" _config.yml
      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick
      - name: Install and Build
        run: |
          pip3 install --upgrade jupyter
          export JEKYLL_ENV=production
          bundle exec jekyll build --lsi
      - name: Purge unused CSS
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Install matching chromedriver
        run: |
          CHROME_VERSION=$(${{ steps.setup-chrome.outputs.chrome-path }} --version | grep -oP '\d+' | head -1)
          echo "Chrome major version: $CHROME_VERSION"
          sudo npm install -g chromedriver@$CHROME_VERSION
      - name: Run axe
        continue-on-error: true
        # https://github.com/dequelabs/axe-core-npm/tree/develop/packages/cli
        run: |
          sudo npm install -g @axe-core/cli
          sudo npm install -g http-server
          http-server _site/ &
          axe --chromedriver-path $(npm root -g)/chromedriver/bin/chromedriver http://localhost:8080/${{ github.event.inputs.url || env.URL }} --load-delay=1500 --exit
